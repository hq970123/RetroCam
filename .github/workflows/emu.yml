name: Emulator UI tour
on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: release tag to test
        default: v0.1.7
permissions:
  contents: write
jobs:
  tour:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Get APK
        run: curl -fL -o RetroCam.apk https://github.com/${{ github.repository }}/releases/download/${{ inputs.apk_tag }}/RetroCam-${{ inputs.apk_tag }}.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash tools/emu_tour.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots/
      - name: Pack
        if: always()
        run: |
          cd shots && for f in *.png; do convert "$f" -resize 50% "${f%.png}.jpg" 2>/dev/null || cp "$f" "${f%.png}.jpg"; done
          grep -E "retrocam|AndroidRuntime|FATAL|Camera" logcat.txt | tail -400 > log_short.txt || true
          zip -q ../shots.zip *.jpg *.xml log_short.txt crash.txt window.txt
      - name: Publish shots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: emu-shots-${{ github.run_number }}
          name: emu shots ${{ github.run_number }}
          prerelease: true
          files: shots.zip
